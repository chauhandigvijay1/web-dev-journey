<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="55%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B2B2B"/>
      <stop offset="100%" stop-color="#0B0B0B"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square -->
  <rect x="20" y="20" width="216" height="216" rx="48"
        fill="#0D1117" stroke="#1F2937" stroke-width="2"/>

  <!-- Stylized D -->
  <path d="M72 52H126
           C170 52 198 80 198 128
           C198 176 170 204 126 204
           H72Z"
        fill="none"
        stroke="url(#dark)"
        stroke-width="22"
        stroke-linejoin="round"/>

  <!-- Stylized S ribbon -->
  <path d="M152 76
           L116 98
           C98 110 98 134 118 146
           L164 172
           C180 182 180 202 162 214"
        fill="none"
        stroke="url(#emerald)"
        stroke-width="20"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- center cut -->
  <path d="M88 128H152" stroke="#0D1117" stroke-width="10" stroke-linecap="round"/>
</svg>
